# Builds the images this repo ships and pushes them to Docker Hub.
#
# Requires two repository secrets (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME  your Docker Hub username (lowercase - Docker Hub
#                       namespaces are, and an uppercase one makes an invalid
#                       image reference)
#   DOCKERHUB_TOKEN     an access token from hub.docker.com/settings/security
#
# Image names are <DOCKERHUB_USERNAME>/<image>, so nothing here hardcodes an
# account. Without the secrets the images still build - only the push is
# skipped.
name: docker-publish

on:
  push:
    branches: [main]
    paths:
      - 'docker-build/**'
      - 'docker-build-saltgui/**'
      - '.github/workflows/docker-publish.yml'
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # secrets cannot be referenced directly in a step's `if:`, so the check is
      # hoisted into an env var here.
      HAVE_CREDS: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    strategy:
      # Independent images: one failing should not hide the other's result.
      fail-fast: false
      matrix:
        include:
          - image: salt
            context: docker-build
            build_arg: SALT_VERSION=3008.2
          - image: saltgui
            context: docker-build-saltgui
            build_arg: SALTGUI_VERSION=1.34.0
    steps:
      - uses: actions/checkout@v4

      - name: Work out the image name
        id: meta
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          owner="${DOCKERHUB_USERNAME}"
          # Without the secret the tag would be "/salt:...", which buildx
          # rejects as an invalid reference before the push gate is consulted -
          # so fall back to a name that is merely unpushable.
          if [ -z "$owner" ]; then
            owner="local"
            echo "::warning::DOCKERHUB_USERNAME is not set - building only, not pushing."
          fi
          version="${{ matrix.build_arg }}"
          version="${version#*=}"
          echo "image=$owner/${{ matrix.image }}" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # QEMU so arm64 can be built on an amd64 runner - the Salt repo serves
      # both architectures.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Check the credential shape
        if: ${{ env.HAVE_CREDS == 'true' }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          # A secret with a stray newline produces "malformed HTTP Authorization
          # header" from the registry, which reads like a wrong password. Only
          # lengths and booleans are printed, never any part of a value.
          bad=0
          for name in DOCKERHUB_USERNAME DOCKERHUB_TOKEN; do
            raw="${!name}"
            trimmed="$(printf '%s' "$raw" | tr -d '[:space:]')"
            if [ "${#raw}" -ne "${#trimmed}" ]; then
              echo "::error::${name} contains whitespace or a newline (length ${#raw}, ${#trimmed} without)."
              bad=1
            fi
          done
          user="${DOCKERHUB_USERNAME}"
          if [ "$user" != "$(printf '%s' "$user" | tr '[:upper:]' '[:lower:]')" ]; then
            echo "::error::DOCKERHUB_USERNAME has uppercase characters - Docker Hub namespaces are lowercase."
            bad=1
          fi
          [ "$bad" -eq 0 ] && echo "credentials look well-formed"
          exit "$bad"

      - name: Log in to Docker Hub
        if: ${{ env.HAVE_CREDS == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: ${{ env.HAVE_CREDS == 'true' }}
          build-args: ${{ matrix.build_arg }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Say what happened
        run: |
          if [ "${HAVE_CREDS}" = "true" ]; then
            echo "Pushed ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}"
          else
            echo "Built but not pushed: set DOCKERHUB_USERNAME and DOCKERHUB_TOKEN"
          fi
