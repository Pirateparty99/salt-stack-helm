# Builds the Salt master image and pushes it to Docker Hub.
#
# Requires two repository secrets (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME  your Docker Hub username
#   DOCKERHUB_TOKEN     an access token from hub.docker.com/settings/security
#                       (an access token, not your password - it can be revoked
#                       on its own and scoped to read/write)
#
# The image name is <DOCKERHUB_USERNAME>/salt, so nothing here hardcodes an
# account. Change IMAGE_NAME below if you want a different repository name.
name: docker-publish

on:
  push:
    branches: [main]
    paths:
      - 'docker-build/**'
      - '.github/workflows/docker-publish.yml'
    tags: ['v*']
  # Lets you build a specific Salt version without committing anything.
  workflow_dispatch:
    inputs:
      salt_version:
        description: 'Salt version from the official apt repo'
        required: false
        default: '3008.2'

env:
  IMAGE_NAME: salt
  DEFAULT_SALT_VERSION: '3008.2'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # secrets cannot be referenced directly in a step's `if:`, so the check is
      # hoisted into an env var here. Without credentials the image is still
      # built - the push is just skipped, rather than the job failing on auth.
      HAVE_CREDS: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out the image name and version
        id: meta
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          version="${{ github.event.inputs.salt_version || env.DEFAULT_SALT_VERSION }}"
          owner="${DOCKERHUB_USERNAME}"
          # Without the secret the tag would be "/salt:...", which buildx
          # rejects as an invalid reference before the push gate is ever
          # consulted - so fall back to a name that is merely unpushable.
          if [ -z "$owner" ]; then
            owner="local"
            echo "::warning::DOCKERHUB_USERNAME is not set - building only, not pushing."
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=$owner/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      # QEMU so the arm64 image can be built on an amd64 runner. The Salt repo
      # serves both architectures, so there is no reason to publish only one.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # A secret with a stray newline or space produces "malformed HTTP
      # Authorization header" from the registry, which reads like a wrong
      # password and sends you looking in the wrong place. Checked here so the
      # failure names the actual problem. Only lengths and booleans are printed,
      # never any part of a value.
      - name: Check the credential shape
        if: ${{ env.HAVE_CREDS == 'true' }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          bad=0
          for name in DOCKERHUB_USERNAME DOCKERHUB_TOKEN; do
            raw="${!name}"
            trimmed="$(printf '%s' "$raw" | tr -d '[:space:]')"
            if [ "${#raw}" -ne "${#trimmed}" ]; then
              echo "::error::${name} contains whitespace or a newline (length ${#raw}, ${#trimmed} without). Re-enter it with no trailing newline."
              bad=1
            fi
          done
          # Docker Hub namespaces are lowercase; an uppercase one also makes an
          # invalid image reference later.
          user="${DOCKERHUB_USERNAME}"
          if [ "$user" != "$(printf '%s' "$user" | tr '[:upper:]' '[:lower:]')" ]; then
            echo "::error::DOCKERHUB_USERNAME has uppercase characters - Docker Hub namespaces are lowercase."
            bad=1
          fi
          [ "$bad" -eq 0 ] && echo "credentials look well-formed"
          exit "$bad"

      - name: Log in to Docker Hub
        if: ${{ env.HAVE_CREDS == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker-build
          platforms: linux/amd64,linux/arm64
          push: ${{ env.HAVE_CREDS == 'true' }}
          build-args: |
            SALT_VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          # Layer cache in the registry, so a rebuild that only changes the Salt
          # version does not re-download the base image and apt metadata.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Say what happened
        run: |
          if [ "${HAVE_CREDS}" = "true" ]; then
            echo "Pushed ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}"
          else
            echo "Built but not pushed: set DOCKERHUB_USERNAME and DOCKERHUB_TOKEN"
            echo "in Settings -> Secrets and variables -> Actions, then re-run."
          fi
