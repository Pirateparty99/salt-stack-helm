apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "salt.fullname" . }}-config
  labels:
    {{- include "salt.labels" . | nindent 4 }}
data:
  # Mounted over /etc/salt/master, replacing the packaged file rather than
  # layering under it in master.d. The package ships `user: salt`, which makes
  # salt-master try to become a user it is not: under OpenShift the container
  # runs as an arbitrary UID with no passwd entry, so the lookup fails with
  # "Failed to prepare the Salt environment for user" and the master exits 2.
  # With no `user` key at all Salt runs as whoever started it, which is correct
  # here and cannot be expressed by overriding the key.
  master: |
    # The default pidfile is /var/run/salt-master.pid, which is on the
    # read-only root filesystem. This path is the emptyDir mounted below.
    pidfile: /var/run/salt/salt-master.pid
    {{- toYaml .Values.config | nindent 4 }}
    {{- if .Values.api.enabled }}
    rest_cherrypy:
      port: {{ .Values.api.port }}
      disable_ssl: true
    {{- end }}
