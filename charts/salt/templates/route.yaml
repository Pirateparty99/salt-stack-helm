{{- if and .Values.route.enabled .Values.api.enabled }}
# OpenShift Route for salt-api only. Routes carry HTTP(S), so the minion ports
# 4505/4506 cannot go through one - use service.type LoadBalancer or NodePort
# for minions outside the cluster.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "salt.fullname" . }}
  labels:
    {{- include "salt.labels" . | nindent 4 }}
  {{- with .Values.route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.route.host }}
  host: {{ . | quote }}
  {{- end }}
  to:
    kind: Service
    name: {{ include "salt.fullname" . }}
  port:
    targetPort: api
  {{- with .Values.route.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if and .Values.route.enabled (not .Values.api.enabled) }}
{{- fail "route.enabled requires api.enabled - a Route can only expose salt-api, not the minion ports" }}
{{- end }}
