# Default values for the salt chart.

# -- Number of salt-master pods. A master holds minion keys and PKI on its
# volume, so more than one needs shared storage and an external key store;
# leave at 1 unless you have arranged that.
replicaCount: 1

image:
  # -- Built by this repo's docker-build/, because there is no current upstream
  # Salt container: the official saltstack/salt images stop at 3006.5 (Feb 2024)
  # while Salt itself is at 3008.x. UBI 10, multi-arch, non-root.
  repository: pirateparty99/salt
  # -- Defaults to .Chart.AppVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

# -- Extra salt-master configuration, rendered into /etc/salt/master.d/master.conf.
# Anything valid in a master config file works here.
config:
  file_roots:
    base:
      - /srv/salt
  pillar_roots:
    base:
      - /srv/pillar
  # Minions are accepted by hand by default. Setting this to true accepts any
  # minion that connects, which is fine for a lab and dangerous anywhere else.
  auto_accept: false

service:
  type: ClusterIP
  annotations: {}
  # -- Only set with type LoadBalancer.
  loadBalancerIP: ""
  loadBalancerSourceRanges: []
  ports:
    # Minions connect to 4505 (publish) and 4506 (return). Both are raw TCP, so
    # an Ingress or an OpenShift Route cannot carry them - minions outside the
    # cluster need type LoadBalancer or NodePort.
    publish: 4505
    ret: 4506
  nodePorts:
    publish: ""
    ret: ""

# -- salt-api (REST). Off by default: it needs an auth backend configured in
# `config` to be useful, and exposing it without one is worse than not having it.
api:
  enabled: false
  port: 8000
  # -- Which API clients salt-api will serve. Modern Salt refuses every request
  # unless this is set, so an api with an empty list is an api that rejects
  # everything. These four are what SaltGUI uses.
  enableClients:
    - local
    - local_async
    - runner
    - wheel
  # -- salt-api runs as a second container from the same image.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

# -- SaltGUI, a web interface served by salt-api itself. Requires api.enabled:
# it is a static site that sends credentials to salt-api, which authenticates
# them - so whatever external_auth the master is configured with is what the UI
# logs in against. Served from the same origin as the API, which avoids CORS.
#
# The image only carries files; an init container copies them into a volume the
# salt-api container reads, keeping the salt image free of web assets.
saltgui:
  enabled: false
  image:
    repository: pirateparty99/saltgui
    tag: "1.34.0"
    pullPolicy: IfNotPresent

# -- Authentication for salt-api, as Salt's external_auth. Without it salt-api
# has nothing to authenticate against and every login fails.
#
# The LDAP bind password does not belong here: set externalAuth.existingSecret
# to a Secret holding a `ldap.conf` key, which is mounted into master.d and
# merged over this. See the chart README.
externalAuth:
  enabled: false
  # -- Rendered into the master config as `external_auth`. The AD group form is
  # 'CN=group,OU=...%' - the trailing % is what marks it as a group rather than
  # a user, and is easy to lose.
  config: {}
  #   ldap:
  #     'CN=salt-admins,OU=Groups,OU=KANTO,DC=kanto,DC=internal%':
  #       - .*
  #       - '@runner'
  #       - '@wheel'
  #       - '@jobs'
  # -- Secret with an `ldap.conf` key holding the auth.ldap.* settings,
  # including the bind password. Mounted at /etc/salt/master.d/ldap.conf.
  existingSecret: ""

# -- OpenShift Route for salt-api. Ignored unless api.enabled. Routes are
# HTTP(S) only, which is why this cannot expose 4505/4506.
route:
  enabled: false
  host: ""
  annotations: {}
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

persistence:
  enabled: true
  # -- Minion keys live here. Losing this volume means re-accepting every minion.
  size: 4Gi
  storageClass: ""
  existingClaim: ""
  accessModes:
    - ReadWriteOnce
  annotations: {}

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

# -- Pod-level security context. Deliberately empty: a hardcoded fsGroup or
# runAsUser is rejected outright by OpenShift's restricted-v2 SCC, which
# allocates each namespace its own UID range. Leaving this empty lets the
# platform choose. Set it explicitly only on clusters that require it.
podSecurityContext: {}

# -- Container security context. Hardened by default; every field here is one
# the image was built to satisfy.
securityContext:
  allowPrivilegeEscalation: false
  # Salt writes only to the paths mounted below, so the rest of the filesystem
  # can be read-only. Set false if a custom state or module needs to write
  # somewhere else - and prefer adding a mount to turning this off.
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

# -- Probes check the master's TCP ports rather than an HTTP endpoint, because
# salt-master serves no HTTP unless salt-api is enabled.
livenessProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 20
readinessProbe:
  enabled: true
  initialDelaySeconds: 10
  periodSeconds: 10

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

# -- Sidecar that keeps /srv/salt in sync with a git repo, so state files are
# version controlled rather than baked into the volume.
gitsync:
  enabled: false
  image:
    repository: registry.k8s.io/git-sync/git-sync
    tag: v4.4.0
    pullPolicy: IfNotPresent
  repo: ""
  ref: HEAD
  period: 60s
  env: {}
  resources: {}
